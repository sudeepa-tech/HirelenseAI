services:
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      AI_SERVICE_URL: http://ai-service:8081
      INTERVIEW_SERVICE_URL: http://interview-service:8082
    depends_on: [ai-service, interview-service]
  ai-service:
    build: { context: ., dockerfile: services/ai-service/Dockerfile }
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-4-5}
      MOCK_AI: ${MOCK_AI:-false}
  interview-service:
    build: { context: ., dockerfile: services/interview-service/Dockerfile }
    environment:
      MAX_HISTORY: ${MAX_HISTORY:-5}
      DATA_DIR: /data
    volumes: ["interview-data:/data"]
volumes:
  interview-data:
